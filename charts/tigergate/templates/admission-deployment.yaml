{{- if .Values.admission.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tigergate.fullname" . }}-admission-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-controller
spec:
  replicas: {{ .Values.admission.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: admission-controller
  template:
    metadata:
      labels:
        {{- include "tigergate.labels" . | nindent 8 }}
        app.kubernetes.io/component: admission-controller
    spec:
      serviceAccountName: {{ include "tigergate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission-controller
          image: {{ include "tigergate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/tigergate-admission-controller"]
          args:
            - "--addr=:8443"
            - "--mode={{ .Values.admission.mode }}"
            - "--level={{ .Values.admission.level }}"
            {{- if .Values.admission.allowedRegistries }}
            - "--allowed-registries={{ join "," .Values.admission.allowedRegistries }}"
            {{- end }}
            - "--tls-cert=/etc/tigergate/tls/tls.crt"
            - "--tls-key=/etc/tigergate/tls/tls.key"
          env:
            {{- if .Values.region }}
            - name: TG_REGION
              value: {{ .Values.region | quote }}
            {{- end }}
            {{- if .Values.backend.url }}
            - name: TG_BACKEND_URL
              value: {{ .Values.backend.url | quote }}
            {{- end }}
            {{- if .Values.backend.ingestGrpcAddr }}
            - name: TG_INGEST_GRPC_ADDR
              value: {{ .Values.backend.ingestGrpcAddr | quote }}
            {{- end }}
            - name: TG_CLUSTER_NAME
              value: {{ required "clusterName is required" .Values.clusterName | quote }}
            - name: TG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tigergate.secretRef" . }}
                  key: apiKey
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: tls
              mountPath: /etc/tigergate/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.admission.resources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "tigergate.fullname" . }}-admission-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tigergate.fullname" . }}-admission-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-controller
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admission-controller
  ports:
    - name: https
      port: 443
      targetPort: 8443
{{- end }}
