{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tigergate.backendSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ required "backend.apiKey is required (your org tg_ API key) — or set backend.existingSecret" .Values.backend.apiKey | quote }}
{{- end }}
