nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

region: ""

backend:
  url: ""
  apiKey: ""
  existingSecret: ""
  ingestGrpcAddr: ""

clusterName: ""

image:
  repository: tigergate/tigergate-kspm-agent
  tag: "latest"
  pullPolicy: IfNotPresent

controller:
  enabled: true
  scanIntervalPosture: "30m"
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

relay:
  port: 8090

blockKspm: false
blockRuntime: false

admission:
  enabled: true
  mode: "audit"
  level: "baseline"
  allowedRegistries: []
  failurePolicy: "Ignore"
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }

sensor:
  enabled: true
  image:
    repository: docker.io/tigergate/tigergate-sensor
    tag: "v1.0.2"
    pullPolicy: IfNotPresent
  ingestGrpcAddr: ""
  privileged: true
  hostPID: true
  hostNetwork: false
  mountKernelDebug: true
  enableK8sApi: true
  enableTracingPolicyCrd: false
  enablePolicyFilter: true
  disableKprobeMulti: false
  export:
    enabled: true
    filename: /var/run/tigergate/tigergate-sensor.log
    maxSizeMb: 10
    maxBackups: 3
    compress: true
  extraEnv: []
  extraArgs: []
  tolerations:
    - operator: "Exists"
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values: ["fargate"]
              - key: type
                operator: NotIn
                values: ["virtual-kubelet"]
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

nodeScanner:
  enabled: false
  runMode: "loop"
  interval: "30m"
  checkKubeletFiles: true
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

remediation:
  enabled: false
  pollInterval: "15s"
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

network:
  restrictEgress: true
  apiServerPorts:
    - 6443
    - 8443
    - 16443
