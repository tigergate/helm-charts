nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

region: ""

backend:
  url: ""
  apiKey: ""
  existingSecret: ""
  ingestGrpcAddr: ""

clusterName: ""

image:
  repository: tigergate/tigergate-kspm-agent
  tag: "1.0.4"
  pullPolicy: IfNotPresent

controller:
  enabled: true
  scanIntervalPosture: "30m"
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

relay:
  port: 8090

blockKspm: false
blockRuntime: false

admission:
  enabled: true
  mode: "audit"
  level: "baseline"
  allowedRegistries: []
  failurePolicy: "Ignore"
  # Namespaces to exclude from admission checks, beyond the three the chart
  # always excludes on its own (kube-system, kube-node-lease, the release's
  # own namespace). Put a namespace here instead of `kubectl patch`-ing the
  # live ValidatingWebhookConfiguration: a manual patch isn't visible to
  # Helm, so it silently conflicts with (and can be silently wiped by) the
  # next `helm upgrade` — that already happened once in the field.
  extraExcludedNamespaces: []
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }

sensor:
  enabled: true
  image:
    repository: tigergate/tigergate-sensor
    # Pin, don't float on "latest" — a privileged, eBPF-loading DaemonSet
    # shouldn't silently change what it runs on a node reboot. The git tag
    # is v1.0.4; the image on Docker Hub has no "v".
    tag: "1.0.4"
    pullPolicy: IfNotPresent
  ingestGrpcAddr: ""
  privileged: true
  hostPID: true
  hostNetwork: false
  mountKernelDebug: true
  enableK8sApi: true
  enableTracingPolicyCrd: false
  enablePolicyFilter: true
  disableKprobeMulti: false
  export:
    enabled: true
    filename: /var/run/tigergate/tigergate-sensor.log
    maxSizeMb: 10
    maxBackups: 3
    compress: true
  extraEnv: []
  extraArgs: []
  tolerations:
    - operator: "Exists"
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values: ["fargate"]
              - key: type
                operator: NotIn
                values: ["virtual-kubelet"]
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "1Gi" }

nodeScanner:
  enabled: false
  runMode: "loop"
  interval: "30m"
  checkKubeletFiles: true
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

remediation:
  enabled: false
  pollInterval: "15s"
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

network:
  restrictEgress: true
  # NetworkPolicy ports match the destination AFTER the Service is resolved to a
  # pod, so DNS must be allowed on the port CoreDNS itself listens on, not only
  # the Service's 53. Several distributions run CoreDNS unprivileged on 1053
  # behind port 53; without it every agent's DNS lookup is dropped.
  dnsPorts:
    - 53
    - 1053
  apiServerPorts:
    - 6443
    - 8443
    - 16443
