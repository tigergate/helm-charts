{{- if .Values.admission.enabled }}
{{- $fullName := include "tigergate.fullname" . }}
{{- $svc := printf "%s-admission-controller" $fullName }}
{{- $ns := .Release.Namespace }}
{{- $cn := printf "%s.%s.svc" $svc $ns }}
{{- $altNames := list $cn (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- $ca := genCA "tigergate-admission-ca" 3650 }}
{{- $cert := genSignedCert $cn nil $altNames 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-admission-tls
  namespace: {{ $ns }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $fullName }}-admission-controller
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
webhooks:
  - name: pods.admission-controller.tigergate.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: {{ .Values.admission.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate
        port: 443
      caBundle: {{ $ca.Cert | b64enc }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    # Namespaces excluded from admission checks. kube-system, kube-node-lease
    # and the release's own namespace are ALWAYS excluded (the classic
    # self-lockout case: the webhook rejecting the pods that run it). Anything
    # beyond that is admission.extraExcludedNamespaces — see values.yaml for
    # why this has to be a chart value and not a `kubectl patch` on the live
    # object: a manual patch here becomes a field-manager conflict on the
    # NEXT `helm upgrade` (Kubernetes server-side apply refuses to let Helm's
    # own field manager overwrite a field `kubectl-patch` owns), and forcing
    # past that conflict silently wipes the patch — re-enabling enforcement
    # on every namespace it was excluding, with no warning that it happened.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-node-lease
            - {{ $ns }}
            {{- range .Values.admission.extraExcludedNamespaces }}
            - {{ . }}
            {{- end }}
{{- end }}
