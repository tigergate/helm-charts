{{- if .Values.network.restrictEgress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tigergate.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 50051
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.relay.port }}
    - to: []
      ports:
        {{- range .Values.network.apiServerPorts | default (list 6443 8443 16443) }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
