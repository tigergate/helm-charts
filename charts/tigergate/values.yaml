# TigerGate unified agent chart. Minimal install:
#
#   helm install tigergate oci://registry.tigergate.dev/charts/tigergate \
#     --namespace tigergate-system --create-namespace \
#     --set backend.apiKey=tg_<org-api-key> \
#     --set clusterName=my-cluster
#
# One ORG API key (tg_…) authorizes every component; the cluster auto-registers
# under your org on the operator's first report — no separate registration step.
#
# ── Works on every KSPM environment ─────────────────────────────────────────
# Self-hosted (k3s / kubeadm / bare-metal-VM clusters) AND managed control
# planes (EKS / AKS / GKE / OKE) run the SAME chart — the only thing that
# should differ between them is `nodeScanner.enabled` (see that section below):
# turn it ON for self-hosted so CIS control-plane/kubelet checks resolve to
# real PASS/FAIL instead of NOT_ASSESSED, and leave it OFF on managed clusters
# where the control plane isn't reachable from inside the cluster at all.
# Everything else (operator, admission-controller, remediator) is generic
# client-go against the Kubernetes API and needs no per-flavor configuration.

nameOverride: ""
fullnameOverride: ""

# Pull secrets applied to every pod (operator, admission-controller, sensor,
# node-scanner, remediator).
imagePullSecrets: []          # e.g. [{ name: regcred }]

# ── Shared connection ───────────────────────────────────────────────────────
backend:
  url: "https://api.tigergate.dev"
  apiKey: ""                  # ORG API key (tg_…). Required unless existingSecret is set.
  # Reference a pre-created Secret instead of templating one. Must contain key `apiKey`.
  existingSecret: ""
  # gRPC ingest address for scan reports, admission events, and node controls —
  # ALL of that ships here directly, never through the Node.js backend (backend.url
  # is used only for the low-volume image-policy/custom-rules reads and the sensor's
  # HTTP event path). Default is the platform's public ingest endpoint (TLS, port
  # 443 for egress-firewall friendliness) — override with an in-cluster Service DNS
  # name only for a self-hosted platform running in the same cluster as this chart.
  ingestGrpcAddr: "sensor.tigergate.dev:443"

# Customer-chosen cluster name, shared by all components. The cluster auto-registers
# under the org on the operator's first report — no separate registration step.
clusterName: ""

# Image for the Go agents (operator, admission-controller, node-scanner,
# remediator) — one multi-binary image, dual-published by
# .github/workflows/agents-release.yml to Docker Hub (default here) and GHCR
# (ghcr.io/tigergate/tigergate-kspm-agent) as a mirror. Override `repository`
# for a private registry mirror — see install.mdx's "Private registry mirror"
# tab for the imagePullSecrets pairing.
image:
  repository: tigergate/tigergate-kspm-agent
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# ── 1. KSPM posture operator ────────────────────────────────────────────────
# Cluster-scoped Deployment ×1 (binary: tigergate-operator). Runs the
# posture/inventory/KIEM/CIS-NSA engine in-process against the API server
# (read-only) every scanIntervalPosture, fetches org custom-rules + image-trust
# policy each scan, and doubles as the single in-cluster relay point this
# cluster's runtime (eBPF) sensor fleet streams to — sensors dial relay.port
# instead of the platform individually, and the operator forwards upstream.
controller:
  enabled: true
  scanIntervalPosture: "30m"
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# Runtime-sensor relay server embedded in tigergate-operator.
relay:
  port: 8090

# Per-product kill switches. When true, tigergate-operator still runs its scan
# loop / accepts sensor connections locally, but skips forwarding that
# product's data upstream — for an org/cluster that has opted out of KSPM or
# Runtime without uninstalling the chart.
blockKspm: false
blockRuntime: false

# ── 2. Admission controller (ValidatingWebhook) ─────────────────────────────
# Audit by default (warn only); set mode=enforce to deny. failurePolicy Ignore
# keeps the cluster safe if the webhook is down. Admission events are batched
# to the backend via the same gRPC ingest path as scan reports.
admission:
  enabled: true
  mode: "audit"               # audit | enforce
  level: "baseline"           # baseline | restricted
  allowedRegistries: []       # [] = any registry (image-trust off)
  failurePolicy: "Ignore"     # Ignore | Fail
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }

# ── 3. TigerEye runtime sensor (eBPF DaemonSet) ─────────────────────────────
# One pod per node. Collects runtime events (process/file/network/privilege) via
# eBPF and streams them over gRPC to this cluster's tigergate-operator relay
# (see `relay:` above), which forwards on to tigergate-go-ingester for
# tigereye-detect. Requires a privileged container with host PID + kernel
# access for eBPF.
sensor:
  enabled: true
  # Dual-published to Docker Hub (default here, `docker pull tigergate/tigergate-sensor`)
  # and GHCR (ghcr.io/tigergate/tigergate-sensor) as a mirror. Built from the
  # tigereye repo (Cilium Tetragon fork) — see that repo's Dockerfile for how
  # the container itself is renamed from upstream's "tetragon" to
  # "tigergate-sensor". Override `repository` for a private registry mirror.
  image:
    repository: tigergate/tigergate-sensor
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # In-cluster gRPC address of the operator's relay. Leave "" to use the
  # chart-computed default (this release's operator-relay Service DNS name) —
  # override only for a non-standard topology (e.g. sensor deployed via a
  # separate release from the operator).
  ingestGrpcAddr: ""
  # eBPF needs kernel access. Leave true for the real sensor; set false only for a
  # userspace/demo image that doesn't load BPF programs.
  privileged: true
  hostPID: true
  hostNetwork: false
  # Mount the host kernel debug + bpf fs (needed by libbpf-based probes).
  mountKernelDebug: true
  extraEnv: []                # e.g. [{ name: LOG_LEVEL, value: info }]
  extraArgs: []
  # Run on every node incl. tainted control-plane nodes.
  tolerations:
    - operator: "Exists"
  nodeSelector:
    kubernetes.io/os: linux
  # Excludes virtual/serverless node backends that cannot run a privileged
  # DaemonSet at all — no nodeSelector/toleration makes the sensor work on
  # these, this only stops it from sitting stuck Pending trying to:
  #   • EKS Fargate: eks.amazonaws.com/compute-type=fargate nodes use a
  #     virtual-kubelet backend, no DaemonSet support.
  #   • AKS virtual nodes (ACI) / other virtual-kubelet providers: labeled
  #     type=virtual-kubelet.
  # NOT covered here: GKE Autopilot rejects `privileged: true` at admission
  # on its regular (non-virtual) nodes — there's no reliable node label to
  # exclude, so there's nothing a selector can do. Set sensor.enabled=false
  # on Autopilot, or run a Standard node pool alongside it for the sensor.
  # See install.mdx's flavor-compatibility table.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: eks.amazonaws.com/compute-type
                operator: NotIn
                values: ["fargate"]
              - key: type
                operator: NotIn
                values: ["virtual-kubelet"]
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

# ── 4. Per-node CIS host-scanner (optional) ─────────────────────────────────
# Privileged DaemonSet (binary: node-scanner). OFF by default. Reads the HOST
# /proc to evaluate the CIS §1.2/1.3/1.4 control-plane + §2 etcd + §4.2 kubelet
# ARGUMENT controls (turning them from NOT_ASSESSED into real PASS/FAIL) — these
# are unreachable from inside the operator's pod whenever the control plane
# isn't exposed as pods in-cluster.
#
#   ENABLE on self-hosted clusters: k3s, kubeadm, bare-metal/VM control planes.
#   LEAVE OFF on managed clusters: EKS, AKS, GKE, OKE — the control plane isn't
#   on a node you can read there, so this adds nothing but privileged-DaemonSet
#   risk for zero benefit. The operator already reports these controls as
#   NOT_ASSESSED (not FAIL) on managed flavors, so nothing is silently missed.
nodeScanner:
  enabled: false
  runMode: "loop"             # loop | once
  interval: "30m"
  # CIS §4.1 kubelet file ownership/permission checks (kubelet.conf, config.yaml,
  # the kubeadm systemd drop-in). Adds 3 read-only hostPath mounts. Safe to leave
  # on for managed clusters too — files that don't exist there are skipped, not
  # false-failed.
  checkKubeletFiles: true
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

# ── 5. AI-assisted remediation (optional) ───────────────────────────────────
# TigerGuard AI generates a fix for a finding, and — only if this is enabled —
# a SEPARATE, narrowly-scoped Deployment (binary: tigergate-remediator, its own
# ServiceAccount) can preview (dry-run) and apply it against the live cluster
# resource. OFF by default: every other component in this chart is deliberately
# read-only, so this is new write capability into your cluster and must be an
# explicit opt-in, not something a routine `helm upgrade` silently grants.
#
# Deliberately a separate Deployment/ServiceAccount from the operator, not a
# second credential bolted onto it — a Kubernetes pod has exactly one
# ServiceAccount identity, so genuine read/write blast-radius isolation
# requires a separate pod. Its ClusterRole grants ONLY get+patch on
# Deployments/StatefulSets/DaemonSets — never pods, secrets, RBAC, or Jobs/
# CronJobs (whose pod templates are immutable or future-run-only).
#
# Works identically on self-hosted and managed clusters — it patches whatever
# root controller owns the flagged pod, resolved live via ownerReferences.
remediation:
  enabled: false
  pollInterval: "15s"
  resources:
    requests: { cpu: "20m", memory: "32Mi" }
    limits: { cpu: "100m", memory: "128Mi" }

# When true, a NetworkPolicy caps non-host-network pod egress to DNS + 443
# (backend HTTPS) + 50051 (gRPC ingest — scan reports/admission events/node
# controls/remediation-job polling). Set false if your CNI doesn't enforce
# policy. Does not apply to the sensor when sensor.hostNetwork=true
# (host-network pods bypass NetworkPolicy).
network:
  restrictEgress: true
