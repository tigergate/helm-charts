{{- if .Values.sensor.enabled }}
{{- /*
  Runtime-event export config, resolved defensively. `helm upgrade --reuse-values`
  does NOT merge newly-added chart keys into an existing release's values, so a
  release created before sensor.export existed would nil-deref .Values.sensor.export.
  Defaulting through a local dict avoids that AND keeps the exporter ON by default —
  it is REQUIRED for runtime events to ship (the sensor ships from the exporter's
  Send() hook; with it off, BPF captures events but none leave the node). Set
  sensor.export.enabled=false to opt out explicitly.
*/}}
{{- $export := .Values.sensor.export | default dict }}
{{- $exportEnabled := true }}
{{- if kindIs "bool" $export.enabled }}{{- $exportEnabled = $export.enabled }}{{- end }}
{{- $exportFilename := $export.filename | default "/var/run/tigergate/tigergate-sensor.log" }}
{{- $exportMaxSize := $export.maxSizeMb | default 10 }}
{{- $exportMaxBackups := $export.maxBackups | default 3 }}
{{- $exportCompress := true }}
{{- if kindIs "bool" $export.compress }}{{- $exportCompress = $export.compress }}{{- end }}
# TigerGate runtime sensor (one pod per node). Loads eBPF probes to observe process
# execution, file access, network connections and privilege changes, and streams
# the normalized event batches over gRPC to this cluster's tigergate-operator
# relay (controller-deployment.yaml's relay Service), which forwards every batch
# on to tigergate-go-ingester under the org's API key — the sensor never talks to
# the platform directly, matching every other KSPM component's "one relay point
# per cluster" pattern. Requires kernel access: a privileged container with host
# PID and the kernel debug/bpf filesystems mounted.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tigergate.fullname" . }}-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sensor
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "tigergate.labels" . | nindent 8 }}
        app.kubernetes.io/component: sensor
    spec:
      serviceAccountName: {{ include "tigergate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: {{ .Values.sensor.hostPID }}
      hostNetwork: {{ .Values.sensor.hostNetwork }}
      {{- if .Values.sensor.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.sensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tigergate-sensor
          image: {{ include "tigergate.sensorImage" . | quote }}
          imagePullPolicy: {{ .Values.sensor.image.pullPolicy }}
          args:
            {{- if .Values.sensor.enableK8sApi }}
            # Associate kernel events with the pod/namespace/labels that produced
            # them (sensor defaults --enable-k8s-api to false → host-only events).
            - --enable-k8s-api
            # TigerGate ships tracing policies as FILES (tracing-policy-dir), not
            # as CRDs. Enabling the K8s API otherwise starts the sensor's CRD
            # controller-manager, which blocks on startup waiting for TracingPolicy
            # CRDs that are never installed. Turn it off so pod-metadata enrichment
            # works without a CRD dependency. Set sensor.enableTracingPolicyCrd=true
            # (and install the CRDs) if you distribute policies as CRDs instead.
            {{- if not .Values.sensor.enableTracingPolicyCrd }}
            - --enable-tracing-policy-crd=false
            {{- end }}
            {{- end }}
            {{- if $exportEnabled }}
            # Enable the JSON event exporter. This is REQUIRED for runtime events
            # to reach the platform: the sensor ships each event batch to the
            # ingest from the exporter's Send() hook, so with the exporter off
            # (the binary's default) BPF captures events but none are shipped.
            # The file itself lands in an in-pod emptyDir (see volumes), bounded
            # by the rotation caps below.
            - --export-filename={{ $exportFilename }}
            - --export-file-max-size-mb={{ $exportMaxSize }}
            - --export-file-max-backups={{ $exportMaxBackups }}
            {{- if $exportCompress }}
            - --export-file-compress
            {{- end }}
            {{- end }}
            {{- with .Values.sensor.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Endpoint ladder, applied by the SENSOR (not here): an explicit URL
            # wins, then $TIGERGATE_REGION, then the default region. Each var is
            # emitted only when actually set, so a chart with neither behaves
            # exactly as it did before `region` existed.
            #
            # The sensor streams kernel events out of this cluster, so this is
            # the value that decides which country they land in. It reads
            # TIGERGATE_REGION; TG_REGION on the other components is a different
            # name for the same code.
            {{- if .Values.region }}
            - name: TIGERGATE_REGION
              value: {{ .Values.region | quote }}
            {{- end }}
            {{- if .Values.backend.url }}
            - name: TIGERGATE_BACKEND_URL
              value: {{ .Values.backend.url | quote }}
            {{- end }}
            {{- with (include "tigergate.sensorIngestAddr" .) }}
            - name: TIGERGATE_INGEST_GRPC_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.controller.enabled }}
            - name: TIGERGATE_OPERATOR_ADDR
              value: {{ include "tigergate.sensorOperatorAddr" . | quote }}
            {{- end }}
            - name: TIGERGATE_CLUSTER_NAME
              value: {{ required "clusterName is required" .Values.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TIGERGATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tigergate.secretRef" . }}
                  key: apiKey
            {{- with .Values.sensor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            privileged: {{ .Values.sensor.privileged }}
            {{- if not .Values.sensor.privileged }}
            capabilities:
              add: ["BPF", "PERFMON", "SYS_RESOURCE", "SYS_ADMIN", "SYS_PTRACE"]
            {{- end }}
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            {{- if .Values.sensor.mountKernelDebug }}
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            {{- end }}
            {{- if $exportEnabled }}
            # In-pod ephemeral store for the JSON export file + its rotated
            # backups. Mounting the file's parent dir keeps the write off the host
            # filesystem so a busy node can't hit DiskPressure from event volume.
            - name: tigergate-export
              mountPath: {{ dir $exportFilename }}
            {{- end }}
          resources:
            {{- toYaml .Values.sensor.resources | nindent 12 }}
      volumes:
        {{- if .Values.sensor.mountKernelDebug }}
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        {{- end }}
        {{- if $exportEnabled }}
        - name: tigergate-export
          emptyDir:
            sizeLimit: {{ mul $exportMaxSize (add $exportMaxBackups 1) }}Mi
        {{- end }}
{{- end }}
