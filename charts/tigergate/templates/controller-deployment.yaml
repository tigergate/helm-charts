{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tigergate.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "tigergate.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "tigergate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "tigergate.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/tigergate-operator"]
          args:
            - "--interval={{ .Values.controller.scanIntervalPosture }}"
            - "--relay-addr=:{{ .Values.relay.port }}"
          ports:
            - name: relay
              containerPort: {{ .Values.relay.port }}
          env:
            - name: TG_BACKEND_URL
              value: {{ .Values.backend.url | quote }}
            - name: TG_INGEST_GRPC_ADDR
              value: {{ .Values.backend.ingestGrpcAddr | quote }}
            - name: TG_CLUSTER_NAME
              value: {{ required "clusterName is required (the cluster auto-registers under your org)" .Values.clusterName | quote }}
            - name: TG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tigergate.secretRef" . }}
                  key: apiKey
            - name: TG_BLOCK_KSPM
              value: {{ .Values.blockKspm | quote }}
            - name: TG_BLOCK_RUNTIME
              value: {{ .Values.blockRuntime | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
---
# Runtime-sensor relay endpoint — this cluster's eBPF sensor fleet streams
# here (in-cluster, plaintext) instead of dialing the platform individually;
# tigergate-operator forwards every batch upstream to the gRPC ingest address
# under its own org API key. Not exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tigergate.fullname" . }}-operator-relay
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
  ports:
    - name: relay
      port: {{ .Values.relay.port }}
      targetPort: {{ .Values.relay.port }}
{{- end }}
