{{- if .Values.sensor.enabled }}
{{- /*
  Runtime-event export config, resolved defensively. `helm upgrade --reuse-values`
  does NOT merge newly-added chart keys into an existing release's values, so a
  release created before sensor.export existed would nil-deref .Values.sensor.export.
  Defaulting through a local dict avoids that AND keeps the exporter ON by default —
  it is REQUIRED for runtime events to ship (the sensor ships from the exporter's
  Send() hook; with it off, BPF captures events but none leave the node). Set
  sensor.export.enabled=false to opt out explicitly.
*/}}
{{- $export := .Values.sensor.export | default dict }}
{{- $exportEnabled := true }}
{{- if kindIs "bool" $export.enabled }}{{- $exportEnabled = $export.enabled }}{{- end }}
{{- $exportFilename := $export.filename | default "/var/run/tigergate/tigergate-sensor.log" }}
{{- $exportMaxSize := $export.maxSizeMb | default 10 }}
{{- $exportMaxBackups := $export.maxBackups | default 3 }}
{{- $exportCompress := true }}
{{- if kindIs "bool" $export.compress }}{{- $exportCompress = $export.compress }}{{- end }}
{{- /* Same --reuse-values reasoning: a release that predates the key gets true. */}}
{{- $policyFilter := true }}
{{- if kindIs "bool" .Values.sensor.enablePolicyFilter }}{{- $policyFilter = .Values.sensor.enablePolicyFilter }}{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tigergate.fullname" . }}-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tigergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sensor
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "tigergate.labels" . | nindent 8 }}
        app.kubernetes.io/component: sensor
    spec:
      serviceAccountName: {{ include "tigergate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: {{ .Values.sensor.hostPID }}
      hostNetwork: {{ .Values.sensor.hostNetwork }}
      {{- if .Values.sensor.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.sensor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sensor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tigergate-sensor
          image: {{ include "tigergate.sensorImage" . | quote }}
          imagePullPolicy: {{ .Values.sensor.image.pullPolicy }}
          args:
            {{- if .Values.sensor.enableK8sApi }}
            - --enable-k8s-api
            {{- if not .Values.sensor.enableTracingPolicyCrd }}
            - --enable-tracing-policy-crd=false
            {{- end }}
            {{- end }}
            - --enable-policy-filter={{ $policyFilter }}
            {{- if .Values.sensor.disableKprobeMulti }}
            - --disable-kprobe-multi
            {{- end }}
            {{- if $exportEnabled }}
            - --export-filename={{ $exportFilename }}
            - --export-file-max-size-mb={{ $exportMaxSize }}
            - --export-file-max-backups={{ $exportMaxBackups }}
            {{- if $exportCompress }}
            - --export-file-compress
            {{- end }}
            {{- end }}
            {{- with .Values.sensor.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.region }}
            - name: TIGERGATE_REGION
              value: {{ .Values.region | quote }}
            {{- end }}
            {{- if .Values.backend.url }}
            - name: TIGERGATE_BACKEND_URL
              value: {{ .Values.backend.url | quote }}
            {{- end }}
            {{- with (include "tigergate.sensorIngestAddr" .) }}
            - name: TIGERGATE_INGEST_GRPC_ADDR
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.controller.enabled }}
            - name: TIGERGATE_OPERATOR_ADDR
              value: {{ include "tigergate.sensorOperatorAddr" . | quote }}
            {{- end }}
            - name: TIGERGATE_CLUSTER_NAME
              value: {{ required "clusterName is required" .Values.clusterName | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TIGERGATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tigergate.secretRef" . }}
                  key: apiKey
            {{- with .Values.sensor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            privileged: {{ .Values.sensor.privileged }}
            {{- if not .Values.sensor.privileged }}
            capabilities:
              add: ["BPF", "PERFMON", "SYS_RESOURCE", "SYS_ADMIN", "SYS_PTRACE"]
            {{- end }}
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            {{- if .Values.sensor.mountKernelDebug }}
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            {{- end }}
            {{- if $exportEnabled }}
            - name: tigergate-export
              mountPath: {{ dir $exportFilename }}
            {{- end }}
          resources:
            {{- toYaml .Values.sensor.resources | nindent 12 }}
      volumes:
        {{- if .Values.sensor.mountKernelDebug }}
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        {{- end }}
        {{- if $exportEnabled }}
        - name: tigergate-export
          emptyDir:
            sizeLimit: {{ mul $exportMaxSize (add $exportMaxBackups 1) }}Mi
        {{- end }}
{{- end }}
